<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="app-version" content="2.3.2" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>久谦·行业品类品牌趋势看板V2.3.2</title>
    <link rel="stylesheet" href="./styles.css?v=2.3.2" />
  </head>
  <body>
    <div class="wrap">
      <div class="global-top">
        <header>
          <div>
            <h1>久谦·行业品类品牌趋势看板<span>V2.3.2</span></h1>
            <p>从行业结构，到增长品类，再到品牌竞争</p>
          </div>
        </header>
        <div id="controls" inert>
          <nav id="nav" aria-label="页面"></nav>
          <div class="filters">
            <label
              >快捷时段<select id="mode">
                <option value="mat">近12个月</option>
                <option value="ytd">年累计</option>
                <option value="month">单月</option>
                <option value="years">历年</option>
                <option value="custom">自定义</option>
              </select></label
            ><label>起始月份<input id="start" type="month" /></label
            ><label>截止月份<input id="end" type="month" /></label>
            <div id="year-controls" class="filter-group" hidden>
              <label>起始年份<select id="year-start"></select></label>
              <label>截止年份<select id="year-end"></select></label>
            </div>
            <div class="filter-group">
              <span>平台：</span>
              <div id="platforms" aria-label="平台"></div>
            </div>
            <div class="filter-group">
              <span>类目：</span
              ><button id="category-button" aria-expanded="false">
                全部类目 · 分级多选
              </button>
            </div>
            <button
              id="overview-all"
              aria-pressed="true"
              title="开启查看所有行业，关闭回到类目框中的选择"
            >
              全部类目
            </button>
            <button id="reset" class="quiet">重置</button>
          </div>
          <div id="category-picker" hidden>
            <div class="picker-head">
              <input
                id="cat-search"
                type="search"
                placeholder="搜索一级、二级或三级类目"
                aria-label="搜索类目"
              /><button id="cat-all">选中行业全部</button
              ><button id="cat-clear">清空</button
              ><button id="cat-done">完成</button>
            </div>
            <p class="note">
              仅支持同一一级类目内多选；选择另一行业会替换当前选择，勾选后立即生效。
            </p>
            <div id="category-tree"></div>
          </div>
          <div class="range" id="range"></div>
        </div>
      </div>
      <main id="main" aria-live="polite">
        <p class="loading">正在加载久谦行业数据…</p>
      </main>
      <footer id="footer"></footer>
    </div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="./app.js?v=2.3.2"></script>
  </body>
</html>
